# /etc/nginx/sites-available/ndt  (ganti ndt.example.id dan path sesuai server)
server {
    listen 80;
    server_name ndt.example.id;

    # Foto bukti dan laporan bisa besar
    client_max_body_size 20m;

    # Frontend hasil `npm run build` (VITE_API_URL=/api)
    root /var/www/ndt/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Backend FastAPI; awalan /api dibuang sebelum diteruskan
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
